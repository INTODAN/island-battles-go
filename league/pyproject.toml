[project]
name = "island-battles-league"
version = "0.0.0"
description = "Island Battles bots that AI agents write and improve, and the tools that play them against each other"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "island-battles-python",
]

[project.scripts]
league = "league_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

# The bots play with the SDK of this checkout, the one the headless runner's
# rules belong to, not with a release from PyPI.
[tool.uv.sources]
island-battles-python = { path = "../clients/island-battles-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bots", "league_tools"]

[tool.ruff]
extend-exclude = ["*.md", "runs"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
