repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: sdk-contracts
        name: SDK contracts, generated clients, and conformance
        entry: ./scripts/check-sdks.sh
        language: system
        files: '^(backend/|api/game/|cmd/export-game-openapi/|clients/|lobby/(api/|httpapi/|cmd/export-lobby-openapi/|clients/lobby-python/)|docs/sdk/|scripts/check-sdks\.sh)'
        pass_filenames: false

      - id: go-fmt
        name: go fmt
        entry: go fmt ./... ./lobby/...
        language: system
        types: [go]
        pass_filenames: false # go fmt runs on whole project by default

      - id: go-vet
        name: go vet
        entry: go vet ./... ./lobby/...
        language: system
        types: [go]
        pass_filenames: false # go vet runs on whole project by default

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m ./... ./lobby/...
        language: system
        types: [go]
        pass_filenames: false # golangci-lint runs on whole project by default

      - id: go-test
        name: go test
        entry: go test ./... ./lobby/...
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
