repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        # go fmt doesn't read go.work, so the Go SDK module is formatted separately.
        entry: sh -c 'go fmt ./... && go -C clients/island-battles-go fmt ./...'
        language: system
        types: [go]
        pass_filenames: false # go fmt runs on whole project by default

      - id: go-vet
        name: go vet
        entry: go vet ./... ./clients/island-battles-go/...
        language: system
        types: [go]
        pass_filenames: false # go vet runs on whole project by default

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m ./... ./clients/island-battles-go/...
        language: system
        types: [go]
        pass_filenames: false # golangci-lint runs on whole project by default

      - id: go-test
        name: go test
        entry: go test ./... ./clients/island-battles-go/...
        language: system
        types: [go]
        pass_filenames: false

      - id: biome
        name: biome (web client)
        # Needs `bun install` in clients/island-battles-web first.
        entry: sh -c 'cd clients/island-battles-web && bun run biome ci .'
        language: system
        files: ^clients/island-battles-web/
        exclude: ^clients/island-battles-web/bun\.lock$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
