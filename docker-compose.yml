services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "islandBattles", "-d", "islandBattles" ]
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=islandBattles
      - POSTGRES_PASSWORD=islandBattles
      - POSTGRES_DB=islandBattles
    expose:
      - 5432
    ports:
      - 5432:5432
    command: ["postgres", "-c", "wal_level=logical", "-c", "wal_writer_delay=10ms"]

