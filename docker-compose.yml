services:
  db:
    image: postgres:18-alpine
    volumes:
      # PostgreSQL 18 stores data under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
      # A new volume also gets the lobby's own role and database (#229);
      # scripts/dev.sh makes them in an older volume.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "islandBattles", "-d", "islandBattles"]
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: islandBattles
      POSTGRES_PASSWORD: islandBattles
      POSTGRES_DB: islandBattles
    ports:
      - 5432:5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
  centrifugo:
    # Pinned after checking Centrifugo v6.9.6 configuration documentation.
    image: centrifugo/centrifugo:v6.9.6
    restart: unless-stopped
    volumes:
      # The lobby's configuration, which scripts/dev.sh copies here from the
      # lobby module that go.mod pins (github.com/INTODAN/mpl).
      - ./.lobby-centrifugo:/centrifugo:ro,Z
    command: centrifugo -c /centrifugo/centrifugo-config.toml
    ports:
      - "8000:8000"
    # Centrifugo is the lobby's: it takes the lobby's secrets, and sends its
    # proxy calls to the lobby, which scripts/dev.sh runs on the host on :8890.
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${LOBBY_CONNECTION_TOKEN_HMAC_SECRET:?set LOBBY_CONNECTION_TOKEN_HMAC_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${LOBBY_CENTRIFUGO_API_KEY:?set LOBBY_CENTRIFUGO_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${ISLAND_BATTLES_CENTRIFUGO_ADMIN_PASSWORD:?set ISLAND_BATTLES_CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${ISLAND_BATTLES_CENTRIFUGO_ADMIN_SECRET:?set ISLAND_BATTLES_CENTRIFUGO_ADMIN_SECRET}
      CENTRIFUGO_VAR_LOBBY_PROXY_SECRET: ${LOBBY_PROXY_SECRET:?set LOBBY_PROXY_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${ISLAND_BATTLES_CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://127.0.0.1:3000 http://localhost:8890 http://127.0.0.1:8890 tauri://localhost http://tauri.localhost}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgres_data:
