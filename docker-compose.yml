services:
  db:
    image: postgis/postgis
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "islandBattles", "-d", "islandBattles"]
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=islandBattles
      - POSTGRES_PASSWORD=islandBattles
      - POSTGRES_DB=islandBattles
    ports:
      - 5432:5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # backend:
  #   build: ./backend
  #   restart: unless-stopped
  #   volumes:
  #     - ./backend:/usr/src/app
  #   expose:
  #     - 8888
  #   ports:
  #     - 8888:8888
  #   depends_on:
  #     db:
  #       condition: service_healthy
  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    volumes:
      - ./centrifugo:/centrifugo
    command: centrifugo -c /centrifugo/centrifugo-config.toml
    ports:
      - "8000:8000"
    environment:
      - CENTRIFUGO_PROXIES=[{"name":"proxy_ping","endpoint":"http://host.docker.internal:8888/ping"}]
      - CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT=http://host.docker.internal:8888/connect
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgres_data:
