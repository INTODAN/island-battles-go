# Releases the backend, started by hand from main (deploy/README.md,
# "Releasing"). Merging to main releases nothing.
#
# Starting this workflow is the approval: only people with write access can,
# only from main, and the deploy jobs run in the `production` environment,
# which is limited to main. It runs the checks, deploys (the VM first when its
# inputs changed since the last release, unless INTODAN/mpl has taken the VM
# over, then the backend, then the web client
# in /play/, then the smoke test), and only after all of that creates the tags
# and the GitHub release. A failed check or deploy leaves no tag and no release.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise. A release whose VM deploy inputs changed is always major."
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time. This group must differ from `deploy`, the group of the
# Deploy workflow's job that this workflow calls: a caller holding the group
# its callee waits for would deadlock.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fails on any other ref, so the refusal shows in the run instead of every
  # job being skipped.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check that the run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release starts only from main, not from ${GITHUB_REF}. Nothing was tagged or deployed."
          exit 1

  check:
    needs: guard
    uses: ./.github/workflows/checks.yml

  # Who deploys the VM: once INTODAN/mpl has taken it over, the deploy
  # bucket's mpl/vm-owner names it, and the release leaves the VM alone
  # (deploy/README.md, "The VM belongs to INTODAN/mpl"). Reading the bucket
  # needs the deploy role, which trusts only the production environment.
  vm_owner:
    needs: guard
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: owner
        run: |
          owner="$(python3 -I deploy/deploy_files.py vm-owner)"
          echo "owner=$owner" >>"$GITHUB_OUTPUT"

  plan:
    needs: [check, vm_owner]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      vm: ${{ steps.plan.outputs.vm }}
      vm_owner: ${{ steps.plan.outputs.vm_owner }}
    steps:
      # All history and tags, to find the previous release and diff against it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
          ISLAND_BATTLES_VM_OWNER: ${{ needs.vm_owner.outputs.owner }}
        run: |
          scripts/release-plan.sh "$BUMP" "$GITHUB_SHA" >"$RUNNER_TEMP/outputs" 2>"$RUNNER_TEMP/summary" || {
            cat "$RUNNER_TEMP/summary"
            echo "::error::$(tail -n 1 "$RUNNER_TEMP/summary")"
            exit 1
          }
          cat "$RUNNER_TEMP/summary" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/outputs" >>"$GITHUB_OUTPUT"
          if [[ -n "$ISLAND_BATTLES_VM_OWNER" ]]; then
            echo "::notice::The release doesn't deploy the VM: the deploy bucket's mpl/vm-owner says $ISLAND_BATTLES_VM_OWNER deploys it now."
          fi

  # Each deploy is a call of the Deploy workflow, whose job runs in the
  # `production` environment (an environment can't be set on a calling job),
  # needs id-token from here, and holds the group `deploy` while it runs.
  deploy_vm:
    needs: plan
    if: needs.plan.outputs.vm == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: vm
      version: ${{ needs.plan.outputs.version }}

  deploy_backend:
    needs: [plan, deploy_vm]
    # deploy_vm is skipped when the VM stays as it is.
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: backend
      version: ${{ needs.plan.outputs.version }}

  # The client built from the released commit goes live with the backend it
  # talks to; the smoke test checks that /play/ serves it.
  deploy_web:
    needs: [plan, deploy_backend]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: web
      version: ${{ needs.plan.outputs.version }}

  smoke:
    needs: [plan, deploy_web]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: smoke
      version: ${{ needs.plan.outputs.version }}
      web_bundle: ${{ needs.deploy_web.outputs.web_bundle }}

  release:
    needs: [plan, smoke]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    # The only job that writes to the repository.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      VM: ${{ needs.plan.outputs.vm }}
      VM_OWNER: ${{ needs.plan.outputs.vm_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # Annotated tags on the commit that was checked and deployed. The Go SDK
      # module is tagged with the same version, with its directory as the
      # prefix, as Go modules in a subdirectory require; the SDK's tag is what
      # `go get` of a version resolves. The lobby is released from its own
      # repository, INTODAN/mpl.
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git tag -a "clients/island-battles-go/$VERSION" -m "Go SDK $VERSION" "$GITHUB_SHA"
          git push --atomic origin "refs/tags/$VERSION" "refs/tags/clients/island-battles-go/$VERSION"

      - name: Create the GitHub release
        run: |
          if [[ "$VM" == true ]]; then
            note="The VM was redeployed too: something its deploy uses changed since ${PREVIOUS:-the start}."
          elif [[ -n "$VM_OWNER" ]]; then
            note="The VM was not redeployed: it is deployed from INTODAN/$VM_OWNER now."
          else
            note="The VM was not redeployed: nothing its deploy uses changed since $PREVIOUS."
          fi
          start=()
          [[ -z "$PREVIOUS" ]] || start=(--notes-start-tag "$PREVIOUS")
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes \
            "${start[@]}" --notes "$note

          The Go SDK is tagged clients/island-battles-go/$VERSION: go get github.com/INTODAN/island-battles-go/clients/island-battles-go@$VERSION"

      # A release made with GITHUB_TOKEN doesn't trigger `on: release`, so the
      # jobs that follow it (publish-python, #117) belong in this workflow, not
      # in a workflow of their own.

  # Publishes the Python SDK, island-battles-python (#117), at the release's
  # version, after the tags and the GitHub release exist, so a PyPI version
  # never lacks its tag. It needs `release` rather than the deploy jobs: the
  # deploy is done by then, and a failure here fails only this job and the
  # run, visibly. The deploy and the tags and release stay. Fix the cause and
  # re-run this job alone; the `skip-existing` setting makes a re-run skip the
  # files a partial run uploaded. The lobby's client, mpl-lobby-client, is
  # published by the lobby's own repository, INTODAN/mpl.
  # Trusted publishing: no PyPI token exists. The PyPI publisher names this
  # workflow and the environment `pypi-island-battles` (deploy/README.md,
  # "Publishing the Python clients").
  publish-python:
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi-island-battles
    permissions:
      contents: read
      # Only the publish step uses it; PyPI exchanges this token for an upload token.
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # The version comes from the tag and is set in this run's working copy
      # only, never committed. PyPI wants PEP 440, so `v0.1.0` becomes `0.1.0`.
      - name: Set the release version
        working-directory: clients/island-battles-python
        run: uv version --frozen "${VERSION#v}"

      - name: Build the package
        run: |
          v="${VERSION#v}"
          uv build clients/island-battles-python --out-dir "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/island_battles_python-${v}-py3-none-any.whl"
          test -f "$RUNNER_TEMP/dist/island_battles_python-${v}.tar.gz"
          test "$(ls "$RUNNER_TEMP/dist" | wc -l)" -eq 2
          ls -l "$RUNNER_TEMP/dist"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist
          skip-existing: true

  # Says why nothing was tagged. The failed job above is the cause.
  not_released:
    needs: [guard, check, vm_owner, plan, deploy_vm, deploy_backend, deploy_web, smoke, release]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::The release was not made: a step above failed or was cancelled. No tag and no GitHub release were created (unless the release job itself is the failed one: look for the tags in the repository before starting again). Fix the cause and start the release again."
          exit 1
