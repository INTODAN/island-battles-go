# Deploys from a GitHub runner, with the same scripts as a person's machine
# (deploy/README.md, "Deploying from GitHub Actions"). Jobs assume an AWS role
# through GitHub's OIDC provider, so no AWS keys are stored here, and the
# scripts pull deploy/local/ from the deploy bucket and push it back.
#
# Every job runs in the `production` environment, which the repository's
# settings limit to main, and both roles trust only that environment. So only
# merged code ever gets AWS credentials: merging is the approval. That is how
# an agent in the cloud deploys: once its pull request is merged, it starts
# these runs on main.
#
# The release workflow (release.yml) calls this one with workflow_call, once
# each for vm, backend, web and smoke, and passes the release's version. A person can
# deploy an earlier release again with release_tag, to roll back.
#
# - backend, vm, web, smoke and plan use the deploy role
#   (deploy/terraform/github.tf), which can only publish the backend and the
#   bot runners' code, upload the web client, log in to the VM and use the
#   deploy bucket.
# - plan saves a plan under plans/<run ID>/ in the deploy bucket and posts it
#   to the run's summary. apply applies one saved plan, by that run ID, with
#   the apply role (deploy/github_apply_role.py), so what was read is what's
#   applied.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "backend: scripts/aws.sh deploy. vm: scripts/vm.sh deploy to the static IP, refused once INTODAN/mpl has taken the VM over. web: scripts/deploy-web-client.sh, which builds the 3D client and publishes it at /play/. smoke: scripts/vm.sh smoke. plan: plan every AWS resource and save the plan. apply: apply the plan that plan_run_id saved."
        type: choice
        options: [backend, vm, web, smoke, plan, apply]
        default: backend
      plan_run_id:
        description: "apply only: the ID of the plan run whose plan to apply."
        type: string
        default: ""
      allow_destroy:
        description: "apply only: comma-separated names of the instances, static IP, disks or distribution the plan may delete or replace."
        type: string
        default: ""
      release_tag:
        description: "backend, vm, web or smoke only: deploy this release (such as v0.1.0) instead of main, to roll back. The tag must be on main. The backend then reports that version, and smoke expects it."
        type: string
        default: ""
  workflow_call:
    inputs:
      target:
        description: "backend, vm, web or smoke (plan and apply are for people)."
        type: string
        required: true
      version:
        description: "The release's version, such as v0.1.0: the backend is built with it, and smoke expects /healthz to report it."
        type: string
        default: ""
      web_bundle:
        description: "smoke only: the entry script that /play/ must load, such as assets/index-1a2b3c4d.js, from the web target's web_bundle output. Empty skips the web client check."
        type: string
        default: ""
    outputs:
      web_bundle:
        description: "web only: the entry script of the web client just uploaded, such as assets/index-1a2b3c4d.js."
        value: ${{ jobs.deploy.outputs.web_bundle }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Both roles trust only this environment's jobs. Limit it to main in the
    # repository's settings.
    environment: production
    timeout-minutes: 90
    outputs:
      web_bundle: ${{ steps.web.outputs.bundle }}
    # One deploy at a time. A second one waits instead of cancelling the first.
    # This is on the job, not the workflow, so the release workflow that calls
    # this one must not use the group `deploy` itself: it would hold the group
    # its called job waits for, and the call would never start.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # Build and smoke-test the release's version. Empty means a plain build,
      # which reports "dev", and a smoke test that checks no version.
      ISLAND_BATTLES_VERSION: ${{ inputs.release_tag || inputs.version }}
      ISLAND_BATTLES_EXPECTED_VERSION: ${{ inputs.release_tag || inputs.version }}
      # Empty skips the smoke test's check of /play/.
      ISLAND_BATTLES_EXPECTED_WEB_BUNDLE: ${{ inputs.web_bundle }}
    steps:
      # The environment's branch limit is the real gate; this says why early.
      - name: Check that the run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy runs only on main, so only merged code reaches AWS. Merge the pull request, then start the run on main."
          exit 1

      - name: Check the release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like v0.1.0."
            exit 1
          fi
          if [[ "$TARGET" != backend && "$TARGET" != vm && "$TARGET" != web && "$TARGET" != smoke ]]; then
            echo "::error::release_tag works with the backend, vm, web and smoke targets. plan and apply always use main."
            exit 1
          fi

      # A release tag is checked out whole, so the scripts and the code that
      # deploy are the release's own, with full history for the check that
      # the tag is on main below. Other runs need only their commit. The
      # strings matter: 0 is falsy in a GitHub expression, so 0 would give 1.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: ${{ inputs.release_tag != '' && '0' || '1' }}

      # The environment limits the workflow's own ref, not the code it checks
      # out, so require the tag's commit to be merged to main.
      - name: Check that the tag is on main
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$RELEASE_TAG isn't on main, so it was never merged."
            exit 1
          fi

      - id: role
        env:
          TARGET: ${{ inputs.target }}
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [[ "$TARGET" == apply ]]; then
            echo "arn=${APPLY_ROLE:-${DEPLOY_ROLE%/*}/island-battles-github-apply}" >>"$GITHUB_OUTPUT"
          else
            echo "arn=$DEPLOY_ROLE" >>"$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION }}

      # Once INTODAN/mpl has taken the VM over, its Ansible owns the VM's
      # configuration: fail before anything is set up, with the message
      # scripts/vm.sh deploy gives (deploy/README.md, "The VM belongs to
      # INTODAN/mpl"). The check is main's, so a release_tag from before it
      # can't skip it; scripts/vm.sh checks again itself.
      - if: inputs.target == 'vm'
        name: Check that this repository still deploys the VM
        run: |
          git show "$GITHUB_SHA:deploy/deploy_files.py" >"$RUNNER_TEMP/deploy_files.py"
          python3 -I "$RUNNER_TEMP/deploy_files.py" check-vm-owner

      # Builds the backend and the native bot runner, and runs the migrations
      # with `go run`: the backend deploy both databases', and the VM deploy
      # the lobby's (#229).
      - if: contains(fromJSON('["backend", "vm", "plan", "apply"]'), inputs.target)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The client's pinned version, as web-client.yml reads it.
      - if: inputs.target == 'web'
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' clients/island-battles-web/package.json)" >>"$GITHUB_OUTPUT"

      - if: inputs.target == 'web'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # The wrapper would add its own lines to `scripts/aws.sh output static_ip`.
      - if: inputs.target != 'smoke'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - if: inputs.target == 'vm' || inputs.target == 'smoke'
        uses: astral-sh/setup-uv@v6

      - if: inputs.target == 'vm'
        run: uv tool install ansible-core

      - if: inputs.target == 'backend'
        run: scripts/aws.sh deploy

      - if: inputs.target == 'vm'
        run: scripts/vm.sh deploy "$(scripts/aws.sh output static_ip)"

      # Reads the bucket and the distribution from Terraform's outputs (set up
      # above), builds the client, uploads it and invalidates /play/.
      - if: inputs.target == 'web'
        id: web
        env:
          ISLAND_BATTLES_WEB_BUNDLE_FILE: ${{ runner.temp }}/web-bundle
        run: |
          scripts/deploy-web-client.sh
          echo "bundle=$(cat "$ISLAND_BATTLES_WEB_BUNDLE_FILE")" >>"$GITHUB_OUTPUT"

      - if: inputs.target == 'smoke'
        run: scripts/vm.sh smoke

      - if: inputs.target == 'plan'
        run: |
          scripts/aws.sh plan "$RUNNER_TEMP/plan"
          echo "$GITHUB_SHA" >"$RUNNER_TEMP/plan/commit"

      # The plan holds the Lambda's settings, so it goes to the private deploy
      # bucket, not to an artifact. The apply deletes it, and the bucket
      # expires one nobody applied (deploy/deploy_files.py).
      - if: inputs.target == 'plan'
        name: Save the plan
        run: |
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 cp --recursive --only-show-errors "$RUNNER_TEMP/plan" "s3://$bucket/plans/$GITHUB_RUN_ID/"

      # Terraform's text output hides sensitive values.
      - if: inputs.target == 'plan'
        name: Show the plan
        run: |
          {
            echo "## Plan at ${GITHUB_SHA::7}"
            echo "Apply it with target \`apply\` and plan_run_id \`$GITHUB_RUN_ID\`."
            if [[ -s "$RUNNER_TEMP/plan/destroys" ]]; then
              echo
              echo "**It destroys:** $(paste -sd, "$RUNNER_TEMP/plan/destroys"). The apply refuses unless allow_destroy lists each one."
            fi
            echo
            echo "Publishes the backend and runs the migrations: $(cat "$RUNNER_TEMP/plan/publishes-backend")"
            echo
            echo '```'
            grep -E '^(  # |Plan:|No changes)' "$RUNNER_TEMP/plan/plan.txt" || true
            echo '```'
            echo "<details><summary>The whole plan</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan/plan.txt"
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      - if: inputs.target == 'apply'
        name: Fetch the plan
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Set plan_run_id to the ID of a plan run on main."
            exit 1
          fi
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 cp --recursive --only-show-errors "s3://$bucket/plans/$PLAN_RUN_ID/" "$RUNNER_TEMP/plan"
          if [[ ! -f "$RUNNER_TEMP/plan/tfplan" ]]; then
            echo "::error::Run $PLAN_RUN_ID saved no plan, or it was applied or expired. Start a new plan run."
            exit 1
          fi
          # The plan's build and the scripts that apply it must match.
          if [[ "$(cat "$RUNNER_TEMP/plan/commit")" != "$GITHUB_SHA" ]]; then
            echo "::error::Run $PLAN_RUN_ID planned $(cat "$RUNNER_TEMP/plan/commit"), but main is now $GITHUB_SHA. Start a new plan run."
            exit 1
          fi

      - if: inputs.target == 'apply'
        env:
          ISLAND_BATTLES_ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: scripts/aws.sh apply-plan "$RUNNER_TEMP/plan"

      # Applied or refused, the plan isn't applied again: Terraform would call
      # it stale anyway.
      - if: inputs.target == 'apply' && always()
        name: Delete the saved plan
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || exit 0
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 rm --recursive --only-show-errors "s3://$bucket/plans/$PLAN_RUN_ID/"
