# Deploys from a GitHub runner, with the same scripts as a person's machine
# (deploy/README.md, "Deploying from GitHub Actions"). Jobs assume an AWS role
# through GitHub's OIDC provider, so no AWS keys are stored here, and the
# scripts pull deploy/local/ from the deploy bucket and push it back.
#
# - backend, vm and smoke started from main run in the `production`
#   environment, with the deploy role from deploy/terraform/github.tf.
# - The same targets started from any other branch, and every apply, run in
#   `production-approval`, whose required reviewer approves each job before it
#   gets credentials. They use the apply role from deploy/github_apply_role.py,
#   which trusts only that environment. This is how an agent in the cloud
#   deploys: it starts the run, and the owner approves it.
# - apply plans in one job and posts the plan to the run's summary. The apply
#   job then waits for a second approval and applies exactly that plan.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "backend: scripts/aws.sh deploy. vm: scripts/vm.sh deploy to the static IP. smoke: scripts/vm.sh smoke. apply: scripts/aws.sh apply, planned first and applied after a second approval."
        type: choice
        options: [backend, vm, smoke, apply]
        default: backend
      allow_destroy:
        description: "apply only: comma-separated names of the instances, static IP, disks or distribution the plan may delete or replace."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

# One deploy at a time. A second one waits instead of cancelling the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.target != 'apply'
    runs-on: ubuntu-24.04
    # Each role trusts only its environment's jobs. Limit `production` to main
    # in the repository's settings, and give `production-approval` a required
    # reviewer.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'production-approval' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - id: role
        env:
          FROM_MAIN: ${{ github.ref == 'refs/heads/main' }}
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [[ "$FROM_MAIN" == true ]]; then
            echo "arn=$DEPLOY_ROLE" >>"$GITHUB_OUTPUT"
          else
            echo "arn=${APPLY_ROLE:-${DEPLOY_ROLE%/*}/island-battles-github-apply}" >>"$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: inputs.target == 'backend'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The wrapper would add its own lines to `scripts/aws.sh output static_ip`.
      - if: inputs.target != 'smoke'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - if: inputs.target != 'backend'
        uses: astral-sh/setup-uv@v6

      - if: inputs.target == 'vm'
        run: uv tool install ansible-core

      - if: inputs.target == 'backend'
        run: scripts/aws.sh deploy

      - if: inputs.target == 'vm'
        run: scripts/vm.sh deploy "$(scripts/aws.sh output static_ip)"

      - if: inputs.target == 'smoke'
        run: scripts/vm.sh smoke

  plan:
    if: inputs.target == 'apply'
    runs-on: ubuntu-24.04
    environment: production-approval
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: role
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: echo "arn=${APPLY_ROLE:-${DEPLOY_ROLE%/*}/island-battles-github-apply}" >>"$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: scripts/aws.sh plan "$RUNNER_TEMP/plan"

      # The plan holds the Lambda's settings, so it goes to the private deploy
      # bucket, not to an artifact. The apply job deletes it.
      - name: Save the plan for the apply job
        run: |
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 cp --recursive --only-show-errors "$RUNNER_TEMP/plan" "s3://$bucket/plans/$GITHUB_RUN_ID/"

      # Terraform's text output hides sensitive values.
      - name: Show the plan
        run: |
          {
            echo "## Plan for ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
            if [[ -s "$RUNNER_TEMP/plan/destroys" ]]; then
              echo "**It destroys:** $(paste -sd, "$RUNNER_TEMP/plan/destroys"). The apply refuses unless allow_destroy lists each one."
            fi
            echo "Publishes the backend and runs the migrations: $(cat "$RUNNER_TEMP/plan/publishes-backend")"
            echo
            echo '```'
            grep -E '^(  # |Plan:|No changes)' "$RUNNER_TEMP/plan/plan.txt" || true
            echo '```'
            echo "<details><summary>The whole plan</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan/plan.txt"
            echo '```'
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: production-approval
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - id: role
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: echo "arn=${APPLY_ROLE:-${DEPLOY_ROLE%/*}/island-battles-github-apply}" >>"$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ vars.AWS_REGION }}

      # The migrations run with `go run`.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Fetch the plan
        run: |
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 cp --recursive --only-show-errors "s3://$bucket/plans/$GITHUB_RUN_ID/" "$RUNNER_TEMP/plan"

      - env:
          ISLAND_BATTLES_ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: scripts/aws.sh apply-plan "$RUNNER_TEMP/plan"

      - name: Delete the saved plan
        if: always()
        run: |
          read -r bucket _ < <(python3 -I deploy/deploy_files.py bucket)
          aws s3 rm --recursive --only-show-errors "s3://$bucket/plans/$GITHUB_RUN_ID/"
