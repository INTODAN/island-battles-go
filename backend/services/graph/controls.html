<style>
    /* Hide all chart containers by default to prevent flash of content */
    .chart-placeholder {
        width: 900px;
        height: 500px;
        display: none;
    }

    #loading-overlay {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: sans-serif;
        font-size: 24px;
        color: #333;
    }
</style>

<div id="loading-overlay">
    <div>Loading Visualization...</div>
</div>

<div style="text-align: center; margin: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div>
        <button onclick="changeGen(-1)" style="padding: 10px 20px; font-size: 16px;">Previous</button>
        <span style="margin: 0 15px; font-size: 18px; font-weight: bold;">
            Step <input type="number" id="gen-input" value="1" min="1" style="width: 60px; font-size: 16px; text-align: center;"> / <span id="total-gens-display"></span>
        </span>
        <button onclick="changeGen(1)" style="padding: 10px 20px; font-size: 16px;">Next</button>
    </div>
    <input type="range" id="gen-slider" min="0" value="0" style="width: 300px;">
</div>
