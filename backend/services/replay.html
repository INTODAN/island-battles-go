<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Battles replay</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; color: #202d40; background: #fff; }
h1 { font-size: 1.2rem; margin: 0 0 6px; }
p { margin: 0; color: #687386; font-size: .85rem; }
#teams { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
.team { flex: 1; min-width: 130px; padding: 12px; background: #f5f7fb; border-radius: 10px; border-left: 4px solid; }
.team strong, .team span { display: block; overflow-wrap: anywhere; }
.team span { font-size: .8rem; margin-top: 5px; }
svg { display: block; width: 100%; max-height: 330px; border-radius: 14px; background: #edf5fb; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
button { padding: 9px 14px; border: 0; border-radius: 8px; background: #edf2fb; color: #305dc7; font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #aac4ff; outline-offset: 3px; }
input { flex: 1; min-width: 100px; accent-color: #3464e0; }
#turn { white-space: nowrap; font-size: .82rem; }
#outcome { margin-top: 14px; font-weight: 600; color: #202d40; }
/* Keep a line for the summary even with no clashes. The host resizes the frame only after a size message, so growing
   the page here shows a scrollbar for a frame. A fixed line height stops fallback glyphs such as → from adding height. */
#clashes { margin-top: 10px; min-height: 1lh; line-height: 1.4; color: #824309; overflow-wrap: anywhere; }
/* The log panel scrolls inside a fixed height, so loading lines never changes the size the frame reports. */
#logs { margin-top: 16px; }
#logs h2 { font-size: .95rem; margin: 0 0 6px; }
#logs-box { height: 240px; overflow-y: auto; padding: 10px 12px; border-radius: 10px; background: #f5f7fb; font: .78rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#logs-box h3 { font: 700 .82rem system-ui, sans-serif; margin: 10px 0 4px; padding-left: 6px; border-left: 4px solid; }
#logs-box h3:first-child { margin-top: 0; }
#logs-box h4 { font: 600 .78rem system-ui, sans-serif; margin: 6px 0 2px; color: #52667b; }
#logs-box .log-note { font-family: system-ui, sans-serif; margin: 4px 0; }
#logs-box button { margin-top: 6px; }
.log-line { white-space: pre-wrap; overflow-wrap: anywhere; color: #202d40; }
.log-level { font-weight: 700; }
.log-logger { color: #687386; }
.log-debug { color: #7a8699; }
.log-warning { color: #8a5a00; }
.log-error { color: #b42335; }
@media (max-width: 450px) { body { padding: 12px; } .controls input { flex-basis: 100%; order: 1; } }
</style>
</head>
<body>
<h1>Island Battles</h1>
<p>Circles are castles; moving dots are troops. Numbers show soldiers.</p>
<div id="teams"></div>
<svg id="battlefield" viewBox="0 0 800 600" role="img" aria-label="Battlefield showing castles and moving troops"></svg>
<div class="controls">
<button id="play" type="button">Play</button>
<button id="result" type="button">Latest generation</button>
<button id="live" type="button">● Live</button>
<label id="turn" for="timeline"></label>
<input id="timeline" type="range" min="0" value="0" aria-label="Replay turn">
</div>
<p id="outcome" role="status"></p>
<p id="clashes" role="status"></p>
<section id="logs" aria-labelledby="logs-title">
<h2 id="logs-title">Logs</h2>
<div id="logs-box" tabindex="0"></div>
</section>
<script>
"use strict";
const replay = {{.}};
document.body.dataset.gameId = replay.game_id;
const colors = ["#3464e0", "#d94d5b", "#288562", "#9560cb", "#b37914", "#24828f"];
const field = document.getElementById("battlefield");
const slider = document.getElementById("timeline");
const play = document.getElementById("play");
let lastTurn = replay.frames.length - 1;
let latestGeneration = replay.frames[lastTurn].id;
// A finished game has no live generations left to follow.
let followingLive = !replay.ended;
let turn = lastTurn;
let playing = false;
const live = document.getElementById("live");
slider.max = lastTurn;
const color = (team) => colors[(team - 1) % colors.length] || "#8290a4";
const worldScale = 100;
const castleRadius = 0.5; // Visual only; castle arrival still uses its center.
// Castles never move, so the first frame's castles bound every frame. The
// field keeps at least the generated map's 8 by 6 units, with room around
// each castle for its circle and label.
const fieldX = Math.max(4, ...replay.frames[0].castles.map((castle) => Math.abs(castle.x) + 1));
const fieldY = Math.max(3, ...replay.frames[0].castles.map((castle) => Math.abs(castle.y) + 1));
field.setAttribute("viewBox", `0 0 ${2 * fieldX * worldScale} ${2 * fieldY * worldScale}`);
const point = (node) => [(fieldX + node.x) * worldScale, (fieldY + node.y) * worldScale];
// Each castle's upgrade levels, written under its label, such as "Speed 2 · Stop 1".
// Known types come first under short names; any other type follows under its own.
const upgradeNames = new Map([["speed", "Speed"], ["clash_stop_generations", "Stop"]]);
const upgradeRank = (type) => [...upgradeNames.keys()].indexOf(type) >>> 0;
const upgradeLevels = (castle) => Object.keys(castle.upgrades)
  .sort((left, right) => upgradeRank(left) - upgradeRank(right) || left.localeCompare(right))
  .map((type) => `${upgradeNames.get(type) ?? type} ${castle.upgrades[type]}`).join(" · ");
const scoreLabels = new Map();
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let renderedTurn = null;
for (const team of replay.teams) {
  const card = document.createElement("div");
  card.className = "team";
  card.style.borderColor = color(team.color);
  const title = document.createElement("strong");
  title.textContent = `${team.name} · ${team.players.join(", ")}`;
  const score = document.createElement("span");
  card.append(title, score);
  document.getElementById("teams").append(card);
  scoreLabels.set(team.color, score);
}
function svg(tag, attributes, text) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  if (text !== undefined) element.textContent = text;
  field.append(element);
  return element;
}
function renderClashes(frame, animate) {
  const losses = new Map();
  const summaries = [];
  for (const clash of frame.clashes) {
    if (!clash.participants.length) continue;
    const positions = clash.participants.map(point);
    const center = positions.reduce(([x, y], [nextX, nextY]) => [x + nextX / positions.length, y + nextY / positions.length], [0, 0]);
    const radius = Math.max(...positions.map(([x, y], index) => Math.hypot(x - center[0], y - center[1]) + clash.participants[index].clash_radius * worldScale)) + 12;
    const ring = svg("circle", { cx: center[0], cy: center[1], r: radius, fill: "none", stroke: "#b37914", "stroke-width": 2, opacity: .35, "data-kind": "clash-ring", "pointer-events": "none" });
    if (animate && !reducedMotion.matches) {
      ring.style.transformBox = "fill-box";
      ring.style.transformOrigin = "center";
      ring.animate([{ opacity: 1, transform: "scale(.55)" }, { opacity: .35, transform: "scale(1)" }], { duration: 350, easing: "ease-out" });
    }
    const participants = [];
    for (const participant of clash.participants) {
      const team = replay.teams.find((team) => team.color === participant.team_color);
      participants.push(`${team?.name || `Team ${participant.team_color}`} ${participant.soldiers_before} → ${participant.soldiers_after}`);
      if (participant.soldiers_after > 0) {
        losses.set(participant.group_id, (losses.get(participant.group_id) || 0) + participant.soldiers_before - participant.soldiers_after);
        continue;
      }
      const [x, y] = point(participant);
      const ghostRadius = participant.clash_radius * worldScale;
      const outline = svg("circle", { cx: x, cy: y, r: ghostRadius, fill: "none", stroke: color(participant.team_color), "stroke-width": 2, "stroke-dasharray": "4 4", "data-kind": "defeated-outline", "pointer-events": "none" });
      svg("text", { x, y: y + 7, "text-anchor": "middle", "font-size": 25, fill: color(participant.team_color), "data-kind": "defeated-cross", "pointer-events": "none" }, "×");
      if (animate && !reducedMotion.matches) outline.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
    }
    summaries.push(`Clash: ${participants.join(" · ")}`);
  }
  // Aggregate losses when a surviving group fought more than once this turn.
  // A group that died later or arrived at a castle has no active troop label.
  for (const group of frame.soldier_groups) {
    const lost = losses.get(group.id);
    if (!lost) continue;
    const [x, y] = point(group);
    const label = svg("text", { x, y: y - group.clash_radius * worldScale - 12, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: "#824309", "data-kind": "clash-loss", "pointer-events": "none" }, `−${lost}`);
    if (animate && !reducedMotion.matches) label.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 350 });
  }
  document.getElementById("clashes").textContent = summaries.join(". ");
}
function render(animateClashes = false) {
  const frame = replay.frames[turn];
  const animate = animateClashes && renderedTurn !== turn;
  renderedTurn = turn;
  field.replaceChildren();
  for (let index = 1; index < frame.castles.length; index++) {
    const [x1, y1] = point(frame.castles[index - 1]);
    const [x2, y2] = point(frame.castles[index]);
    svg("line", { x1, y1, x2, y2, stroke: "#c6d8e7", "stroke-width": 2, "stroke-dasharray": "7 8" });
  }
  for (const castle of frame.castles) {
    const [x, y] = point(castle);
    svg("circle", { cx: x, cy: y, r: castleRadius * worldScale, fill: "#fff", stroke: color(castle.team_color), "stroke-width": 3, "data-kind": "castle" });
    svg("text", { x, y: y + 8, "text-anchor": "middle", "font-size": 26, "font-weight": 700, fill: color(castle.team_color) }, castle.soldiers);
    svg("text", { x, y: y + 72, "text-anchor": "middle", "font-size": 17, fill: "#52667b" }, `Castle ${castle.id + 1}`);
    svg("text", { x, y: y + 92, "text-anchor": "middle", "font-size": 14, fill: "#52667b", "data-kind": "castle-upgrades" }, upgradeLevels(castle));
  }
  for (const group of frame.soldier_groups) {
    const [x, y] = point(group);
    svg("circle", { cx: x, cy: y, r: group.clash_radius * worldScale, fill: color(group.team_color), stroke: "#fff", "stroke-width": 2, "data-kind": "soldier-group" });
    svg("text", { x, y: y + 5, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "white" }, group.soldiers);
  }
  renderClashes(frame, animate);
  for (const team of replay.teams) {
    const castles = frame.castles.filter((castle) => castle.team_color === team.color);
    const soldiers = [...castles, ...frame.soldier_groups.filter((group) => group.team_color === team.color)].reduce((total, node) => total + node.soldiers, 0);
    scoreLabels.get(team.color).textContent = `${castles.length} castles · ${soldiers} soldiers`;
  }
  slider.value = turn;
  document.getElementById("turn").textContent = `Generation ${turn + 1} / ${lastTurn + 1}`;
  document.getElementById("outcome").textContent = followingLive ? "Live · Waiting for both players’ next turn" : turn === lastTurn ? replay.outcome : "Watching recorded generations…";
  play.textContent = playing ? "Pause" : turn === lastTurn ? "Replay" : "Play";
  live.textContent = followingLive ? "● Live" : "Follow live";
  live.setAttribute("aria-pressed", String(followingLive));
  live.hidden = replay.ended;
  showLogs();
}
play.addEventListener("click", () => { followingLive = false; if (turn === lastTurn) turn = 0; playing = !playing; render(); });
slider.addEventListener("input", () => { turn = Number(slider.value); playing = false; followingLive = false; render(); });
document.getElementById("result").addEventListener("click", () => { turn = lastTurn; playing = false; followingLive = false; render(); });
live.addEventListener("click", () => { followingLive = true; playing = false; turn = lastTurn; render(); });
window.addEventListener("message", (event) => {
  if (event.source !== window.parent || event.data?.type !== "lobby.game-state" || event.data.game_key !== "island-battles") return;
  const state = event.data.state;
  if (replay.ended || state?.game_id !== replay.game_id || !state.generation) return;
  const newer = state.generation.id > latestGeneration;
  if (!newer && !state.outcome) return;
  const animate = followingLive;
  const previousLatest = latestGeneration;
  if (newer) {
    // Saved frames have the same shape as live generations.
    latestGeneration = state.generation.id;
    replay.frames.push(state.generation);
    lastTurn = replay.frames.length - 1;
    slider.max = lastTurn;
    if (followingLive) turn = lastTurn;
  }
  // The generation that ends the game is its last; show how it ended.
  if (state.outcome) {
    replay.ended = true;
    replay.outcome = state.outcome.summary;
    followingLive = false;
    // Every team's logs are visible now.
    resetLogs();
  }
  render(animate);
  // The previous turn is over; a panel still showing it loads its final lines.
  if (newer && shownLogs === previousLatest) requestLogs(previousLatest);
});
// The bots' game logs. The frame has no credential, so the lobby page fetches
// them for it: a game.request message names the path, and a lobby.response
// message answers it. Lines of the open turn can still grow, so only
// generations whose turn is over are cached, and the open turn is read again
// every few seconds while it is shown.
const logsBox = document.getElementById("logs-box");
const logCache = new Map();
const logRequests = new Map();
let logRequestCount = 0;
let shownLogs = null;
// The generation whose lines the panel shows, rather than a note.
let renderedLogs = null;
const openTurnRefreshMilliseconds = 3000;
const isOpenTurn = (generation) => !replay.ended && generation === latestGeneration;
function logNote(text) {
  const note = document.createElement("p");
  note.className = "log-note";
  note.textContent = text;
  return note;
}
function showLogs() {
  const generation = replay.frames[turn].id;
  if (shownLogs === generation) return;
  shownLogs = generation;
  document.getElementById("logs-title").textContent = `Logs · Generation ${turn + 1}`;
  if (logCache.has(generation)) {
    renderLogs(logCache.get(generation));
    return;
  }
  if (window.parent === window) {
    logsBox.replaceChildren(logNote("Open the replay from the lobby to see the bots’ logs."));
    return;
  }
  logsBox.replaceChildren(logNote("Loading logs…"));
  requestLogs(generation);
}
function requestLogs(generation) {
  const cacheable = !isOpenTurn(generation);
  if ([...logRequests.values()].some((request) => request.generation === generation && request.cacheable === cacheable)) return;
  const id = `logs-${++logRequestCount}`;
  logRequests.set(id, { generation, cacheable });
  const path = `/game/from-lobby/${encodeURIComponent(replay.lobby_id)}/logs?generation_id=${generation}`;
  window.parent.postMessage({ type: "game.request", id, path }, "*");
  // The page answers every request it accepts; stop waiting for a lost one.
  setTimeout(() => {
    if (logRequests.delete(id) && shownLogs === generation && renderedLogs !== generation) showLogFailure();
  }, 15000);
}
// While the open turn is shown, in a visible tab of a running game, its lines
// are read again on a timer. Each read is a request to the server, so there is
// at most one at a time, and none while the tab is hidden.
setInterval(() => {
  if (window.parent === window || document.visibilityState !== "visible" || shownLogs === null || !isOpenTurn(shownLogs)) return;
  requestLogs(shownLogs);
}, openTurnRefreshMilliseconds);
// Called when the outcome arrives, which reveals every team's logs.
function resetLogs() {
  logCache.clear();
  logRequests.clear();
  shownLogs = null;
  renderedLogs = null;
}
function showLogFailure() {
  const retry = document.createElement("button");
  retry.type = "button";
  retry.textContent = "Retry";
  retry.addEventListener("click", () => {
    shownLogs = null;
    showLogs();
  });
  logsBox.replaceChildren(logNote("The logs could not be loaded."), retry);
  renderedLogs = null;
}
function teamName(teamColor) {
  return replay.teams.find((team) => team.color === teamColor)?.name || `Team ${teamColor}`;
}
// Lines are grouped by team, then by player, in the order they were written.
function renderLogs(logs) {
  const nodes = [];
  let lines = 0;
  for (const team of replay.teams) {
    const players = logs.players.filter((player) => player.team_color === team.color);
    if (!players.length) continue;
    const heading = document.createElement("h3");
    heading.textContent = team.name;
    heading.style.borderColor = color(team.color);
    nodes.push(heading);
    for (const player of players) {
      const name = document.createElement("h4");
      name.textContent = player.display_name;
      nodes.push(name);
      if (!player.lines.length) nodes.push(logNote("No lines."));
      for (const line of player.lines) {
        const row = document.createElement("div");
        row.className = `log-line log-${line.level}`;
        row.dataset.level = line.level;
        const level = document.createElement("span");
        level.className = "log-level";
        level.textContent = line.level.toUpperCase().padEnd(8);
        const logger = document.createElement("span");
        logger.className = "log-logger";
        logger.textContent = `${line.logger}: `;
        row.append(level, logger, line.message);
        nodes.push(row);
        lines++;
      }
    }
  }
  // Without any line, a list of players with no lines says less than one note.
  // While some teams are hidden, the caller sees only their own team. Lines of
  // the open turn may still arrive.
  const open = isOpenTurn(logs.generation_id);
  if (!lines) {
    nodes.splice(0, nodes.length, logNote(open ? "This turn is still open. Lines appear here as the bots log them."
      : logs.hidden_team_colors.length ? "Your team logged nothing in this generation." : "No bot logged anything in this generation."));
  } else if (open) {
    nodes.unshift(logNote("This turn is still open; more lines may arrive."));
  }
  if (logs.hidden_team_colors.length) {
    const names = logs.hidden_team_colors.map((teamColor) => `${teamName(teamColor)}’s`);
    const list = names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names.at(-1)}` : names[0];
    nodes.push(logNote(`${list} logs appear when the game ends.`));
  }
  // A refresh of the shown generation keeps the reader's place.
  const scrollTop = renderedLogs === logs.generation_id ? logsBox.scrollTop : 0;
  logsBox.replaceChildren(...nodes);
  logsBox.scrollTop = scrollTop;
  renderedLogs = logs.generation_id;
}
window.addEventListener("message", (event) => {
  if (event.source !== window.parent || event.data?.type !== "lobby.response") return;
  const request = logRequests.get(event.data.id);
  if (!request) return;
  logRequests.delete(event.data.id);
  const logs = event.data.body;
  if (event.data.status !== 200 || !Array.isArray(logs?.players) || !Array.isArray(logs.hidden_team_colors) || logs.generation_id !== request.generation) {
    // A failed refresh keeps the lines already shown.
    if (shownLogs === request.generation && renderedLogs !== request.generation) showLogFailure();
    return;
  }
  // A read from while the turn was open may answer after its final lines.
  if (!request.cacheable && logCache.has(request.generation)) return;
  if (request.cacheable) logCache.set(request.generation, logs);
  if (shownLogs === request.generation) renderLogs(logs);
});
setInterval(() => {
  if (!playing) return;
  if (turn < lastTurn) turn++;
  if (turn === lastTurn) playing = false;
  render(true);
}, 500);
render();
// Let the host fit the embedded view as summaries wrap or team cards resize.
// Body height is intrinsic, so resizing the frame does not impose a minimum.
if (window.parent !== window) {
  let reportedHeight = 0;
  const reportSize = () => {
    const height = Math.ceil(document.body.getBoundingClientRect().height);
    if (height === reportedHeight) return;
    reportedHeight = height;
    window.parent.postMessage({ type: "game.result-size", height }, "*");
  };
  new ResizeObserver(reportSize).observe(document.body);
  reportSize();
}
</script>
</body>
</html>
