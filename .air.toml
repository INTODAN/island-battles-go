root = "."
testdata_dir = "testdata"
tmp_dir = "C:\\Users\\itaie\\AppData\\Local\\Temp\\island-battles-go"
# tmp_dir= "tmp"
[build]
  args_bin = []
  bin = "C:\\Users\\itaie\\AppData\\Local\\Temp\\island-battles-go\\main.exe"
  cmd = "go build -o C:\\Users\\itaie\\AppData\\Local\\Temp\\island-battles-go\\main.exe ./backend"
  # bin = "/tmp/main.exe"
  # cmd = "go build -o /tmp/main.exe ./backend"
  delay = 100
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["backend"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "C:\\Users\\itaie\\AppData\\Local\\Temp\\island-battles-go\\build-errors.log"
  # log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  # The backend only connects, so bring the schema up to date before each run.
  pre_cmd = ["go run ./backend/cmd/migrate"]
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
