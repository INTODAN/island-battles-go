[project]
name = "my-island-battles-bot"
version = "0.1.0"
description = "My Island Battles bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "island-battles-python>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

# `scripts/build.sh` (uv build) packs bot.py into a wheel and a source archive.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bot.py"]

[tool.ruff]
# The code samples in the skills are fragments, not files to format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
# bot.py sits next to this file; the tests import it as `bot`.
pythonpath = ["."]
testpaths = ["tests"]
