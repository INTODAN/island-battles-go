---
# Reads INTODAN/mpl's settings for the tenant, checks them and this
# repository's secrets, and writes lambda.env. Nothing here contacts AWS or
# the VM.
- name: Check that INTODAN/mpl has published the tenant's settings
  ansible.builtin.stat:
    path: "{{ lambda_env_tenant_file }}"
  register: lambda_env_tenant_stat

- name: Stop without the tenant's settings
  ansible.builtin.fail:
    msg: >-
      {{ lambda_env_tenant_file }} is missing. INTODAN/mpl's VM deploy writes it
      to the deploy bucket as mpl/tenants/{{ lambda_env_tenant_key }}/tenant.env,
      and scripts/lambda-env.sh downloads it (deploy/README.md, "The backend's settings").
  when: not lambda_env_tenant_stat.stat.exists

- name: Read the tenant's settings
  ansible.builtin.set_fact:
    lambda_env_tenant: "{{ lookup('ansible.builtin.file', lambda_env_tenant_file) | env_file }}"
  no_log: true

- name: Check the tenant's settings
  ansible.builtin.assert:
    that:
      - lambda_env_missing | length == 0
      - lambda_env_tenant.LOBBY_GAME_KEY == lambda_env_tenant_key
      - lambda_env_tenant.DATABASE_NAME | default('') == lambda_env_database_name
      - lambda_env_tenant.DATABASE_URL is search('/' ~ lambda_env_database_name ~ '([?]|$)')
      - lambda_env_tenant.DATABASE_URL is match('postgres(ql)?://')
      - lambda_env_tenant.LOBBY_URL is match('https://[^/]+/?$')
      - lambda_env_tenant.CENTRIFUGO_API_URL is match('https://')
      - lambda_env_tenant.LOBBY_GAME_SECRET | length >= 32
    fail_msg: >-
      {{ lambda_env_tenant_file }} isn't the settings of the tenant {{ lambda_env_tenant_key }}
      on its database {{ lambda_env_database_name }}, as INTODAN/mpl writes them (its
      deploy/README.md, "Tenants"). Missing:
      {{ lambda_env_missing | join(', ') if lambda_env_missing else 'nothing, but a value is malformed' }}.
    quiet: true
  vars:
    lambda_env_missing: >-
      {{ ['DATABASE_URL', 'LOBBY_URL', 'LOBBY_GAME_KEY', 'LOBBY_GAME_SECRET', 'CENTRIFUGO_API_URL', 'CENTRIFUGO_API_KEY']
         | reject('in', lambda_env_tenant | dict2items | selectattr('value') | map(attribute='key') | list) | list }}

- name: Check this repository's secrets
  ansible.builtin.stat:
    path: "{{ deploy_secrets_dir }}/{{ item }}"
  loop: [admin_api_key, submit_token_secret]
  register: lambda_env_secrets

- name: Stop without them, unless they may be generated
  ansible.builtin.fail:
    msg: >-
      {{ deploy_secrets_dir }} lacks {{ lambda_env_absent | join(', ') }}. Pull deploy/local/ from the
      deploy bucket (scripts/deploy-files.sh pull). Only a new deployment generates them, with
      -e app_generate_secrets=true: new values would lock out the admin key's users and every bot's
      submit tokens.
  vars:
    lambda_env_absent: "{{ lambda_env_secrets.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  when: lambda_env_absent | length > 0 and not (app_generate_secrets | default(false) | bool)

- name: Write the Lambda's settings
  ansible.builtin.template:
    src: lambda.env.j2
    dest: "{{ deploy_local_dir }}/lambda.env"
    mode: "0600"
  no_log: true
