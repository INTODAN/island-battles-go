---
# Commands run in the Compose project directory on the VM.
app_db_exec: [docker, compose, exec, -T, db]
# psql as the `postgres` superuser, through the container's local socket.
app_superuser_psql: "{{ app_db_exec + ['psql', '--no-psqlrc', '--username', 'postgres'] }}"
# psql as the backend's role over TCP, the way the Lambda connects. The password
# arrives on stdin, so it never appears in a command line, an environment
# variable that sudo logs, or `ps`. The trailing `psql` is the script's $0.
app_backend_psql:
  - docker
  - compose
  - exec
  - -T
  - db
  - sh
  - -c
  - read -r PGPASSWORD && export PGPASSWORD && exec psql --no-psqlrc "$@"
  - psql
app_backend_ssl_query: SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()
# The databases on the VM, each with the role that owns it and connects to it:
# the backend's, and the lobby's own (#229). The backend's comes first.
# Dumps and restores read the names alone, so they never read the passwords,
# whose lookups would generate a missing one.
app_database_owners:
  - { name: "{{ postgres_database }}", role: "{{ postgres_app_role }}" }
  - { name: "{{ lobby_database }}", role: "{{ lobby_app_role }}" }
app_databases:
  - name: "{{ postgres_database }}"
    role: "{{ postgres_app_role }}"
    password: "{{ postgres_app_password }}"
    description: the backend's
  - name: "{{ lobby_database }}"
    role: "{{ lobby_app_role }}"
    password: "{{ lobby_app_password }}"
    description: the lobby's
# The repository on the developer machine, whose lobby/cmd/migrate the VM
# deploy runs.
app_repository_root: "{{ (playbook_dir ~ '/../..') | ansible.builtin.realpath }}"
# The database that a dump or a restore is of: the backend's unless
# -e app_database=<name> names the lobby's.
app_database_selected: "{{ app_database_owners | selectattr('name', 'equalto', app_database) | first }}"
# The admin MCP server's read-only role (#79) connects the same way, and must
# not be able to read lobby_sessions.bearer_hash in either database.
app_admin_check_query: >-
  SELECT ssl AND (to_regclass('public.lobby_sessions') IS NULL
  OR NOT has_column_privilege('public.lobby_sessions', 'bearer_hash', 'SELECT'))
  FROM pg_stat_ssl WHERE pid = pg_backend_pid()
# Written when a move locks the backend out of this VM's database (dump.yml).
# Deploys and restores refuse a VM that has it.
app_moved_away_marker: "{{ vm_app_dir }}/moved-away"
# The backup's bucket and upload-only AWS key. Terraform makes them, and
# scripts/aws.sh apply writes them here; the deploy can't generate them.
app_database_backups_file: "{{ deploy_secrets_dir }}/database_backups.json"
app_database_backups: "{{ lookup('ansible.builtin.file', app_database_backups_file) | ansible.builtin.from_json }}"
app_backup_settings_dir: /etc/island-battles
# The files the deploy reads its secrets from (group_vars/all.yml, and the
# Postgres TLS files in main.yml). Missing ones are only generated on request.
app_secret_files:
  - "{{ deploy_secrets_dir }}/postgres_superuser_password"
  - "{{ deploy_secrets_dir }}/postgres_app_password"
  - "{{ deploy_secrets_dir }}/postgres_lobby_password"
  - "{{ deploy_secrets_dir }}/postgres_admin_password"
  - "{{ deploy_secrets_dir }}/centrifugo_api_key"
  - "{{ deploy_secrets_dir }}/connection_token_hmac_secret"
  - "{{ deploy_secrets_dir }}/lobby_proxy_secret"
  - "{{ deploy_secrets_dir }}/admin_api_key"
  - "{{ deploy_secrets_dir }}/submit_token_secret"
  - "{{ deploy_secrets_dir }}/lobby_player_token_key"
  - "{{ deploy_secrets_dir }}/lobby_game_secret_island_battles"
  - "{{ app_postgres_tls_dir }}/server.key"
  - "{{ app_postgres_tls_dir }}/server.crt"
