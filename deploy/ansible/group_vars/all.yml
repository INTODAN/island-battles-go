---
# Shared by the playbook. scripts/lambda-env.sh runs it.

# Gitignored directory on the developer machine for the settings, this
# repository's secrets and the Lambda's settings.
deploy_local_dir: "{{ (playbook_dir ~ '/../local') | ansible.builtin.realpath }}"
deploy_secrets_dir: "{{ deploy_local_dir }}/secrets"

# What INTODAN/mpl's VM deploy publishes for Island Battles, its tenant, under
# mpl/tenants/island-battles/ in the deploy bucket, and scripts/lambda-env.sh
# downloads here (deploy/README.md, "The backend's settings"): its database,
# the lobby's URL and the hooks' shared secret, and Centrifugo's API.
lambda_env_tenant_file: "{{ deploy_local_dir }}/tenant.env"
lambda_env_tenant_key: island-battles
# The game's database, which holds its maps and games. INTODAN/mpl's tenant
# entry names it, so the cutover moves no data (deploy/README.md, "The
# cutover"); settings that name another database would start the game on an
# empty one.
lambda_env_database_name: island_battles

# This repository's own secrets, which only the Lambda reads. Generated once on
# the first deploy (-e app_generate_secrets=true) and kept in the deploy
# bucket; letters and digits only, so they are safe in env files.
# The backend's admin API key, sent as X-Admin-API-Key to POST /map/create.
admin_api_key: >-
  {{ lookup('ansible.builtin.password', deploy_secrets_dir ~ '/admin_api_key',
     length=48, chars=['ascii_letters', 'digits']) }}
# Signs the one-turn submit tokens that bots submit their commands with
# (#215).
submit_token_secret: >-
  {{ lookup('ansible.builtin.password', deploy_secrets_dir ~ '/submit_token_secret',
     length=64, chars=['ascii_letters', 'digits']) }}
