[project]
name = "island-battles-python"
version = "0.1.0"
description = "Async player client for Island Battles generation turns"
requires-python = ">=3.14"
dependencies = [
    "centrifuge-python==0.6.0",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]
module-name = "island_battles_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
