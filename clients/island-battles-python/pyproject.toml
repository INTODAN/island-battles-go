[project]
name = "island-battles-python"
version = "0.1.0"
description = "Async player client for Island Battles generation turns"
requires-python = ">=3.14"
dependencies = [
    "centrifuge-python==0.6.0",
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
    "jsonschema>=4.26,<5",
    "island-game-api-client",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
integration = ["lobby-python"]

[tool.uv.sources]
island-game-api-client = { path = "generated", editable = true }
lobby-python = { path = "../../lobby/clients/lobby-python", editable = true }
lobby-api-client = { path = "../../lobby/clients/lobby-python/generated", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]
module-name = "island_battles_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
