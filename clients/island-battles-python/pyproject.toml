[project]
name = "island-battles-python"
version = "0.0.0.dev0"
description = "Async player client for Island Battles generation turns"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "centrifuge-python==0.6.0",
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
island-battles-bot = "island_battles_client.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
# The shared lobby acceptance runner executes integration/island_battles here.
integration = [
    "mpl-lobby-client",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
mpl-lobby-client = { path = "../../lobby/clients/lobby-python", editable = true }

[tool.ruff]
# Generated by scripts/generate.py; check it with `generate.py --check` instead.
extend-exclude = ["island_battles_client/_generated.py"]

[tool.ty.src]
exclude = ["island_battles_client/_generated.py"]

[tool.uv.build-backend]
module-name = "island_battles_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# examples.bot is imported from this directory.
pythonpath = ["."]
testpaths = ["tests"]
